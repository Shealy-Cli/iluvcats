<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;

background: #000000;
color: white;

font-family: Arial, Helvetica, sans-serif;

display: flex;
flex-direction: column;
align-items: center;
justify-content: center;

padding: 30px;
}

h1 {
margin: 0 0 25px 0;
font-size: 42px;
letter-spacing: 2px;
}

.cat-container {
width: min(900px, 90vw);
height: min(650px, 70vh);

display: flex;
align-items: center;
justify-content: center;
}

#cat-image {
max-width: 100%;
max-height: 100%;

width: auto;
height: auto;

object-fit: contain;

transition: opacity 0.3s ease;
}

#new-cat {
margin-top: 30px;

padding: 16px 40px;

border: none;
border-radius: 50px;

background: #ff0000;
color: white;

font-size: 20px;
font-weight: bold;

cursor: pointer;

transition:
transform 0.15s ease,
background 0.15s ease;
}

#new-cat:hover {
background: #ff3333;
transform: scale(1.05);
}

#new-cat:active {
transform: scale(0.95);
}

#loading {
position: absolute;
font-size: 18px;
color: #aaa;
}
</style>

<body>
<h1>Random Cat Pictures</h1>

<div class="cat-container">
<div id="loading">Loading cat...</div>

<img
id="cat-image"
alt="Random cute cat picture"
>
</div>

<button id="new-cat">
A NEW CAT
</button>

<script>
const catImage = document.getElementById("cat-image");
const loading = document.getElementById("loading");
const button = document.getElementById("new-cat");

async function getNewCat() {

loading.style.display = "block";
catImage.style.opacity = "0";

try {
const response = await fetch(
"https://api.thecatapi.com/v1/images/search"
);

const data = await response.json();
const imageUrl = data[0].url;

catImage.onload = () => {
loading.style.display = "none";
catImage.style.opacity = "1";
};

catImage.src = imageUrl;

} catch (error) {
loading.textContent = "Couldn't find a cat 😿";
console.error(error);
}
}

button.addEventListener("click", getNewCat);


getNewCat();
</script>

</body>
